<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spin Catur Paramita - PAH Kelas IV</title>
<style>
:root{--bg:#fff4e0;--c:#4a2300;--card:#fff;--ac:#ff8f00;--ok:#2e9e4f;--no:#d63a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1a0a;--c:#ffe9c7;--card:#3d2813}}
:root[data-theme="dark"]{--bg:#2a1a0a;--c:#ffe9c7;--card:#3d2813}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--c);font-family:"Comic Sans MS","Trebuchet MS",sans-serif;text-align:center;padding:10px}
#wrap{max-width:560px;margin:0 auto}.logo{width:clamp(64px,16vw,96px);display:block;margin:0 auto}
h1{margin:4px 0 0;font-size:clamp(20px,5vw,30px)}.sub{font-size:13px;opacity:.85;margin-bottom:8px}
.box{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 4px 14px #0002}
input{font-family:inherit;font-size:20px;padding:12px;border:3px solid var(--ac);border-radius:12px;width:100%;max-width:340px;text-align:center;background:transparent;color:var(--c)}
.btn{padding:12px 26px;font-size:20px;border:0;border-radius:12px;background:var(--ac);color:#fff;cursor:pointer;font-family:inherit;margin-top:12px}
.btn:disabled{opacity:.5}
.hide{display:none!important}
.stat{display:flex;justify-content:space-between;font-weight:bold;margin:4px 6px 8px}
#wh{position:relative;width:min(88vw,380px);margin:0 auto}
#cv{width:100%;display:block;transition:transform 4.2s cubic-bezier(.12,.7,.1,1)}
#ptr{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-size:34px;z-index:2;filter:drop-shadow(0 2px 2px #0006)}
#hub{position:absolute;left:50%;top:50%;width:18%;transform:translate(-50%,-50%);border-radius:50%;background:#fff;border:4px solid var(--ac);aspect-ratio:1;object-fit:contain}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
#ov.on{display:flex}.card{background:var(--card);border-radius:20px;max-width:560px;width:100%;padding:20px;max-height:92vh;overflow:auto}
.q{font-size:clamp(18px,4.5vw,23px);font-weight:bold;margin:6px 0 12px}
.opt{display:block;width:100%;margin:8px 0;padding:13px;font-size:clamp(16px,4vw,20px);border:3px solid var(--ac);border-radius:14px;background:transparent;color:var(--c);cursor:pointer;font-family:inherit;text-align:left}
.opt:hover:not(:disabled){background:var(--ac);color:#fff}.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{background:var(--no);border-color:var(--no);color:#fff;animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#msg{font-size:24px;font-weight:bold;min-height:32px;margin-top:6px}
.big{font-size:56px;font-weight:bold;color:var(--ac)}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:16px}td,th{padding:6px;border-bottom:1px solid #8884}
tr.me{background:rgba(255,143,0,.25);font-weight:bold}
footer{margin-top:14px;font-size:12px;opacity:.75}
</style></head><body><div id="wrap">

<script>
const Q=[["Kata \"Catur\" pada Catur Paramita berarti ….",["dua","tiga","empat","lima"],2],
["Kata \"Paramita\" berarti ….",["hari raya yang besar","sikap atau kebajikan yang luhur","tempat suci","sesaji yang indah"],1],
["Yang termasuk bagian-bagian Catur Paramita adalah ….",["Dharma, Artha, Kama, Moksa","Maitri, Karuna, Mudita, Upeksa","Brahmacari, Grhasta, Wanaprasta, Bhiksuka","Rupaka, Pengajian, Wisesa, Swadhyaya"],1],
["Maitri berarti sikap ….",["ramah, bersahabat, dan penuh kasih sayang kepada sesama","iri kepada teman","tidak peduli kepada teman","marah kepada teman"],0],
["Komang terjatuh dan menangis. Made menolong dan menghiburnya. Sikap Made termasuk ….",["Maitri","Upeksa","Karuna","Mudita"],2],
["Ketut ikut senang dan mengucapkan selamat saat temannya juara lomba menggambar. Sikap Ketut termasuk ….",["Karuna","Maitri","Upeksa","Mudita"],3],
["Wayan mau bermain dengan semua teman tanpa membeda-bedakan dan tidak mudah marah. Sikap Wayan termasuk ….",["Upeksa","Karuna","Mudita","Maitri"],0],
["Manfaat mengamalkan Catur Paramita di kelas adalah ….",["teman-teman menjadi takut","pelajaran tidak perlu dipelajari","kelas menjadi rukun dan damai","kelas menjadi sepi"],2],
["Jika murid di kelas saling mengejek dan iri, yang paling mungkin terjadi adalah ….",["kelas menjadi semakin rukun","suasana kelas menjadi tidak nyaman","semua murid menjadi senang","semua murid menjadi pandai"],1],
["Saat istirahat kamu melihat temanmu duduk sendirian. Sikap yang sesuai dengan Catur Paramita adalah ….",["mengajaknya bermain dan berbicara dengan ramah","membiarkannya sendirian","menertawakannya","pura-pura tidak melihat"],0]];
const N=Q.length,COL=["#ff7043","#ffca28","#66bb6a","#42a5f5","#ab47bc","#ec407a","#26a69a","#ffa726","#7e57c2","#9ccc65"];
const $=id=>document.getElementById(id);
let map,st,rot=0,busy,AC,name,cur;
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function ctx(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,t,d,type,v){const c=ctx();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(c.destination);const s=c.currentTime+t;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.start(s);o.stop(s+d+.05)}
function trumpet(){[[523,0,.15],[659,.15,.15],[784,.3,.15],[1047,.45,.5]].forEach(n=>{tone(n[0],n[1],n[2],"sawtooth",.18);tone(n[0]*2,n[1],n[2],"square",.05)})}
function tetot(){tone(160,0,.25,"square",.25);tone(160,.32,.25,"square",.25)}
function say(t,d){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="id-ID";u.rate=.9;u.pitch=1.3;setTimeout(()=>speechSynthesis.speak(u),d)}catch(e){}}
function draw(){const c=$("cv"),x=c.getContext("2d"),R=300,a=2*Math.PI/N;x.clearRect(0,0,600,600);
for(let i=0;i<N;i++){const s=st[i],a0=-Math.PI/2+i*a;x.beginPath();x.moveTo(R,R);x.arc(R,R,R-6,a0,a0+a);x.closePath();
x.fillStyle=s===1?"#2e9e4f":s===2?"#d63a3a":COL[i];x.fill();x.lineWidth=4;x.strokeStyle="#fff";x.stroke();
x.save();x.translate(R,R);x.rotate(a0+a/2);x.fillStyle="#fff";x.font="bold 54px sans-serif";x.textAlign="right";x.textBaseline="middle";x.shadowColor="#0008";x.shadowBlur=4;x.fillText(s===1?"✓":s===2?"✗":String(i+1),R-34,0);x.restore()}}
function head(){$("pl").textContent="👤 "+name;$("sc").textContent="Skor: "+st.filter(s=>s===1).length*10}
function start(){ctx();name=$("nm").value.trim();if(!name){$("nm").focus();return}
map=sh([...Array(N).keys()]);st=new Array(N).fill(0);rot=0;busy=false;const c=$("cv");c.style.transition="none";c.style.transform="rotate(0deg)";
$("s1").classList.add("hide");$("s3").classList.add("hide");$("s2").classList.remove("hide");head();draw();$("spin").disabled=false}
function spin(){if(busy)return;ctx();const left=[...Array(N).keys()].filter(i=>!st[i]);if(!left.length)return;busy=true;$("spin").disabled=true;
cur=left[Math.random()*left.length|0];const seg=360/N,center=(cur+.5)*seg,want=(((-center-rot)%360)+360)%360;rot+=360*5+want;
const c=$("cv");c.style.transition="transform 4.2s cubic-bezier(.12,.7,.1,1)";c.style.transform=`rotate(${rot}deg)`;
for(let i=0;i<14;i++)tone(600+(i%2)*200,i*.28,.05,"triangle",.06);
setTimeout(ask,4500)}
function ask(){const q=Q[map[cur]],o=sh(q[1].map((t,i)=>({t,ok:i==q[2]})));
let h=`<div style="font-weight:bold;color:var(--ac)">Soal nomor ${cur+1}</div><div class="q">${q[0]}</div>`;o.forEach((x,k)=>h+=`<button class="opt" data-k="${k}">${"ABCD"[k]}. ${x.t}</button>`);h+=`<div id="msg"></div>`;
$("card").innerHTML=h;$("ov").classList.add("on");let done=false;
document.querySelectorAll(".opt").forEach((b,k)=>b.onclick=()=>{if(done)return;done=true;const ok=o[k].ok,m=$("msg");
document.querySelectorAll(".opt").forEach(x=>x.disabled=true);
if(ok){b.classList.add("ok");m.style.color="var(--ok)";m.textContent="🎉 Kamu hebat!";trumpet();say("Kamu hebat!",900)}
else{b.classList.add("no");document.querySelectorAll(".opt").forEach((x,j)=>{if(o[j].ok)x.classList.add("ok")});m.style.color="var(--no)";m.textContent="Dicoba lagi ya!";tetot();say("Dicoba lagi",750)}
st[cur]=ok?1:2;setTimeout(after,2600)})}
function after(){$("ov").classList.remove("on");try{speechSynthesis.cancel()}catch(e){}draw();head();busy=false;if(st.every(Boolean))setTimeout(finish,500);else $("spin").disabled=false}
